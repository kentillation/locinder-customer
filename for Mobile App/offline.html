<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No Internet</title>

    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(145deg, #fcfbf6 0%, #5c3a21 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .container {
        max-width: 400px;
        text-align: center;
        padding: 20px;
      }

      .icon {
        font-size: 80px;
        margin-bottom: 10px;
      }

      .icon-wrapper {
        display: flex;
        justify-content: center;
        margin: 1.5rem auto;
      }

      .no-network-icon {
        width: 140px;
        height: 140px;
        color: #dc2626;
        filter: drop-shadow(0 8px 12px rgba(220, 38, 38, 0.2));
        transition: transform 0.3s ease;
        animation: gentle-float 3s ease-in-out infinite;
      }

      @keyframes gentle-float {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-8px);
        }

        100% {
          transform: translateY(0px);
        }
      }

      h1 {
        color: #dc2626;
        font-size: 22px;
      }

      p {
        color: #fff;
        font-size: 14px;
      }

      button {
        margin-top: 20px;
        padding: 12px 20px;
        border: none;
        border-radius: 30px;
        background: #5c3a21;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:active {
        opacity: 0.8;
      }

      .tips {
        margin-top: 25px;
        text-align: left;
        font-size: 12px;
        color: #ffe8be;
      }

      .tips ul {
        list-style-type: none;
      }

      .tips ul li {
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- <div class="icon">📡</div> -->
      <div class="icon-wrapper">
        <svg
          class="no-network-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="No Network Connection"
        >
          <!-- WiFi signal with cross through it -->
          <path
            d="M2 2L22 22"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <!-- First WiFi arc (close) -->
          <path
            d="M6.5 13.5C8.5 11.5 11 10.5 12 10.5C13 10.5 15.5 11.5 17.5 13.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            fill="none"
          />
          <!-- Second WiFi arc (medium) -->
          <path
            d="M4 11C6.5 8.5 9 7 12 7C15 7 17.5 8.5 20 11"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            fill="none"
            stroke-dasharray="2 2"
          />
          <!-- Third WiFi arc (far) -->
          <path
            d="M2 8.5C5.5 5 8.5 3.5 12 3.5C15.5 3.5 18.5 5 22 8.5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            fill="none"
            stroke-dasharray="3 2"
          />
          <!-- Device/cell phone outline -->
          <rect
            x="9"
            y="16"
            width="6"
            height="5"
            rx="1"
            stroke="currentColor"
            stroke-width="1.5"
            fill="none"
          />
          <!-- Signal indicator on device (no signal) -->
          <line
            x1="12"
            y1="18"
            x2="12"
            y2="20"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <!-- Exclamation mark (error indicator) -->
          <circle cx="12" cy="12" r="1.5" fill="currentColor" />
          <rect
            x="11.5"
            y="8"
            width="1"
            height="3"
            fill="currentColor"
            rx="0.5"
          />
        </svg>
      </div>
      <h1>No Internet Connection</h1>
      <p>Please check your network and try again.</p>

      <button onclick="retry()">Retry Connection</button>

      <div class="tips">
        <p><b>Troubleshooting Tips:</b></p>
        <ul>
          <li>Check your Wi-Fi connection</li>
          <li>Restart your router</li>
          <li>Toggle airplane mode</li>
          <li>Try again later</li>
        </ul>
      </div>
    </div>

    <script>
      function retry() {
        if (navigator.onLine) {
          window.location.href = "/";
        } else {
          alert("Still no internet connection");
        }
      }
    </script>
  </body>
</html>
